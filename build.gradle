plugins {
    id 'axiomatics-policy-devops'
}

version = '1.0'
group = 'com.myorg.alfa'

alfa {
    mainpolicy "acme.Main"
    //withVisualTrace false //Disable evaluation traces of tests, speeds up the tests if you do not need the traces.

    licenseFile "license/axiomatics_ADS.license"

    repositories {
        //Add one or more remotes (AuthHub), each with its own push, pull and test tasks. See
        //  https://docs.axiomatics.com/axiomatics-policy-devops/integrations-cicd/hub-integration
        //  Never write secrets in this file: read them from environment variables, as client_secret below.
        /**
         hub {
         host 'https://myhub.acme.com'
         project 'MyProject'
         domainName 'DevStaging'
         oidcCredentials {
            client_id 'apd'
            client_secret System.getenv('HUB_CLIENT_SECRET')
           }
         }
         **/
    }
}
dependencies {
}

test {
    //Add environment variables needed for tests
    //environment "LDAP_PIP_URL", 'http://ldap-dev.myorg.com'
}

//Add testing task of external ADS
/**
 task test_LocalEnv(type: Test) {
 group "verification"
 environment "ALFA_TEST_REMOTE_URL", "http://127.0.0.1:8080/authorize"
 environment "ALFA_TEST_REMOTE_USER", "pdp-user"
 environment "ALFA_TEST_REMOTE_PASSWORD", "secret"
 }
 **/


import extra.MyLogger
import org.gradle.api.GradleException

def myErrOut = new ByteArrayOutputStream();
def BUILD_ALFA_DEPENDENCIES = project.rootProject.file("build/alfa/dependencies")
rootProject.plugins.apply('java')
repositories {
    def offlineLib = rootProject.projectDir.toPath().resolve("lib").toFile()
    if (offlineLib.exists()) {
        logger.debug("Running in offline mode using local repository at ${offlineLib} (2)")
        maven {
            url uri(offlineLib)
        }
    } else {
        mavenCentral()
        maven {
            url "s3://axiomatics-cr-maven/release"
            credentials(AwsCredentials) {
                accessKey = System.env.AXIOMATICS_ACCESS_KEY_ID ?: project.findProperty('AXIOMATICS_ACCESS_KEY_ID')
                secretKey = System.env.AXIOMATICS_SECRET_ACCESS_KEY ?: project.findProperty('AXIOMATICS_SECRET_ACCESS_KEY')
            }
        }
        maven {
            url "s3://axiomatics-customer-artifacts/releases"
            credentials(AwsCredentials) {
                accessKey = System.env.AXIOMATICS_ACCESS_KEY_ID ?: project.findProperty('AXIOMATICS_ACCESS_KEY_ID')
                secretKey = System.env.AXIOMATICS_SECRET_ACCESS_KEY ?: project.findProperty('AXIOMATICS_SECRET_ACCESS_KEY')
            }
        }
        //mavenLocal()
    }
}



configurations {
    domTool
    alfac
    pip
    pipAds1
    testImplementation.extendsFrom(pip)
    policy
    ads.extendsFrom(pip)
    adsCompile
    adsRuntimeV1.extendsFrom(pip)
    adsRuntimeV1.extendsFrom(pipAds1)
    adsRuntimeV2
    adsRuntimeV1.extendsFrom(implementation)
}


configurations.all {
    resolutionStrategy.cacheChangingModulesFor 4, 'hours'
}


dependencies {

    compileOnly "com.axiomatics.alfa.test:axiomatics-policy-devops-bundle:26.2.0"

    testImplementation(platform("org.junit:junit-bom:5.14.4"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.6.6'
    testImplementation group: 'org.hamcrest', name: 'hamcrest', version: '3.0'
    testImplementation "com.axiomatics.alfa.test:axiomatics-policy-devops-bundle:26.2.0"

    domTool(group: 'com.axiomatics.domtool', name: 'domtool', version: '0.15.0')
    domTool(group: 'com.axiomatics.domtool', name: 'domtool-lib', version: '0.15.0')

    adsCompile "com.axiomatics.access-decision-service:ads-service:2.2.3"

    adsRuntimeV1 "com.axiomatics.access-decision-service:access-decision-service:1.17.1"
    adsRuntimeV2 "com.axiomatics:access-decision-service:26.2.0"

    pipAds1 "com.axiomatics.attribute-connectors.http:http-attribute-connector:5.5.2@jar"
    pipAds1 "com.axiomatics.attribute-connectors.parser:parser-attribute-connectors:1.1.1@jar"
    pipAds1 "com.axiomatics.attribute-connectors.sql:sql-attribute-connector:6.4.1@jar"
    pipAds1 "com.axiomatics.attribute-connectors.ldap:ldap-attribute-connector:6.4.1@jar"
    pipAds1 "com.axiomatics.attribute-connectors.table:table-attribute-connector:7.2.1@jar"

    alfac "com.axiomatics.alfa:alfac:1.5.2"
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

task compileAlfaToPackage(type: JavaExec) {
    doFirst {

        def dir = "${projectDir}/${project.extensions.alfa.srcDir}"
        logger.info("Compiling to package from ${dir}")
        if (!new File(dir).isDirectory()) {
            throw new GradleException("alfa.srcDir is not set or does not exist: ${new File(dir).getAbsolutePath()}")
        }
        myErrOut = new MyLogger();
        errorOutput myErrOut
        workingDir dir
        def outFile = "${buildDir}/alfa/domain/package/policy_package.zip"
        logger.info("Writing package to package ${outFile}")
        args "alfaSpecifications",
                '-p', "${outFile}",
                '-m', "${project.extensions.alfa.mainpolicy}"
    }
    mainClass = "com.axiomatics.alfa.cli.Main"
    group = "axiomatics"
    classpath = project.configurations.alfac
    jvmArgs "--illegal-access=permit"
    doLast {
        println myErrOut.flush()
    }
}

task stageAlfaDependencies(type: Sync) {
    logger.info("Staging from ${configurations.policy} to ${BUILD_ALFA_DEPENDENCIES}")
    from configurations.policy
    into "${BUILD_ALFA_DEPENDENCIES}"
}
project.tasks.withType(Test) {
    logger.info("Configuring test task ${it.name}")
    it.dependsOn stageAlfaDependencies
    it.environment.put("ALFA_RESOLVED_DIR", "${BUILD_ALFA_DEPENDENCIES}")
}

task prepareDirs {
    mkdir "${buildDir}/alfa/domain/package"
    mkdir "${buildDir}/alfa/domain/ads"
}
task stageDeploymentDescriptor(type: Copy) {
    into "${buildDir}/alfa/domain/ads/"
}

tasks.register('copyLicenses', Copy) {
    from("$rootDir/license")
    into("$buildDir/alfa/domain/ads")
}

task runAds(type: JavaExec) {
    doFirst {
        myErrOut = new MyLogger();
        errorOutput myErrOut
        logger.info("Starting ADS from ${workingDir}.")
    }
    group = "axiomatics"
    classpath = project.configurations.adsRuntimeV2

    workingDir "${buildDir}/alfa/domain/ads/"
    ignoreExitValue true

    doLast {
        println myErrOut.flush()
    }
}

// Deprecated since 26.2, removed in 27.1 (APD-204): ADS 1 (runAdsV1, buildAdsDockerImage); use ADS 26
def ads1Deprecation = { String task, String replacement ->
    "APD: task '${task}' (ADS 1) is deprecated and will be removed in APD 27.1. Use ADS 26 with '${replacement}' " +
            "instead; the ADS 1 configuration is in extra/exampleAds1Configuration."
}

task runAdsV1(type: JavaExec) {
    description = "Deprecated, removed in APD 27.1: starts ADS 1 locally. Use runAds (ADS 26)."
    doFirst {
        logger.warn(ads1Deprecation(name, "runAds"))
        myErrOut = new MyLogger();
        errorOutput myErrOut
        logger.info("Starting ADS from ${workingDir}.")
    }
    group = "axiomatics-deprecated"
    classpath = project.configurations.adsRuntimeV1
    workingDir "${buildDir}/alfa/domain/ads/"
    mainClass = "com.axiomatics.ads.App"
    ignoreExitValue true
    args 'server', "deployment.yaml"
    doLast {
        println myErrOut.flush()
    }
}

task stageAdsFiles {}
task buildAdsDockerImage {
    group = "axiomatics-deprecated"
    description = "Deprecated, removed in APD 27.1: builds an ADS 1 Docker image. Use stageDeployment (ADS 26) and build the image from build/install/deployment/ads."
    doLast {
        logger.warn(ads1Deprecation(name, "stageDeployment"))
    }
}

task stageResourcesForAds(type: Copy) {
    into "${buildDir}/alfa/domain/ads/"
    from 'src/extra'
}

task stageLibsForAds2(type: Copy) {
    into "${buildDir}/alfa/domain/ads/"
    from 'src/extra'
}
task stagePipsInLibFolderForAds2(type: Copy) {
    from configurations.pip
    from { tasks.jar.outputs.files }
    into "${buildDir}/alfa/domain/ads/lib"
}

stageAdsFiles.dependsOn stageDeploymentDescriptor
stageAdsFiles.dependsOn stageResourcesForAds
stageAdsFiles.dependsOn copyLicenses
stagePipsInLibFolderForAds2.dependsOn jar

runAds.dependsOn stageAdsFiles
runAds.dependsOn stageLibsForAds2
runAds.dependsOn stagePipsInLibFolderForAds2

runAdsV1.dependsOn stageAdsFiles

rootProject.plugins.apply(AlfaPlugin)

distributions {
    deployment {
        distributionBaseName = 'deployment'
        contents {
            from project.tasks.createEnvFile

            into('ads') {
                from project.configurations.adsRuntimeV2
                from project.tasks.buildAuthzDomain.outputs
                from project.file(project.extensions.alfa.deploymentDescriptor)
                from project.file(project.extensions.alfa.licenseFile)
                from project.file("Dockerfile")
                into('lib') {
                    from project.configurations.pip
                    from project.jar
                }
                into('.') {
                    exclude("README.md")
                    from 'src/extra'
                }
            }
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
    }
}





